<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>AgentHub · 会话入口</title>
    <link rel="icon" href="/assets/agenthub-logo-a-triad.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=workspace-polish" />
  </head>
  <body class="page employee-home page-employee" data-page="employee">
    <section id="auth-modal" class="auth-entry" hidden>
      <div id="auth-modal-content" class="auth-entry-content"></div>
    </section>

    <main class="shell employee-shell" id="employee-shell">
      <header class="topbar compact-topbar">
        <div class="topbar-actions">
          <a class="nav-pill secondary" href="/">返回 AI经理</a>
        </div>
        <div class="status-dot-row">
          <span class="status-dot" id="socket-dot"></span>
          <span id="socket-text">正在连接</span>
        </div>
      </header>

      <section class="surface-card employee-command-card">
        <div class="employee-command-main">
          <div class="hero-copy compact employee-hero">
            <p class="section-kicker">会话入口</p>
            <h1 id="employee-title">正在读取员工</h1>
            <p class="muted" id="employee-subtitle">
              继续当前会话，或者开一个新的。
            </p>
          </div>

          <div class="session-gateway-status">
            <p id="employee-status-copy">正在同步员工状态...</p>
            <p class="muted" id="employee-task-copy">正在同步当前任务...</p>
          </div>

          <div id="employee-context-pills" class="chips compact-chips"></div>
        </div>

        <div class="session-gateway-actions">
          <a class="primary-link-button" id="employee-enter-chat" href="/direct.html">继续会话</a>
          <button type="button" class="secondary-action-button" id="employee-thread-entry">
            <span>
              <strong>新会话</strong>
              <small id="employee-thread-copy">使用当前默认工作区直接开始</small>
            </span>
          </button>
          <button type="button" class="secondary-action-button" id="employee-session-entry">
            <span>
              <strong>导入旧会话</strong>
              <small id="employee-session-copy">从设备上的 Codex 历史会话继续</small>
            </span>
          </button>
        </div>
      </section>

      <section class="surface-card session-switch-card">
        <div class="panel-title-row">
          <div>
            <p class="section-kicker">切换</p>
            <h2>选择会话</h2>
          </div>
        </div>
        <div id="employee-conversation-list" class="employee-conversation-list"></div>
      </section>
    </main>

    <div id="directory-picker-modal" class="sheet-modal" hidden>
      <div id="directory-picker-content" class="sheet-modal-content"></div>
    </div>

    <div id="session-picker-modal" class="sheet-modal" hidden>
      <div id="session-picker-content" class="sheet-modal-content"></div>
    </div>

    <script type="module" src="/app.js?v=workspace-polish"></script>
  </body>
</html>
